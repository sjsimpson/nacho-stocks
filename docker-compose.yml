# Local dev only. Production uses Neon (Postgres) via Vercel Marketplace.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nacho
      POSTGRES_PASSWORD: nacho
      POSTGRES_DB: nacho_stocks
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
